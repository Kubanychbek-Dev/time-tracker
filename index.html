<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>timetracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Times</h1>
    <div class="inputs">
      <label for="">Start of time</label>
      <input type="text" name="text" id="start-of-time" disabled>
      <label for="">End of time</label>
      <input type="text" name="text" id="end-of-time" disabled>
    </div>
    <div class="btns">
      <button class="start-time">Start of Time</button>
      <button class="end-time">End of Time</button>
      <button class="clear">Clear</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
